# Milchglas — project metadata, dev tooling and tool configuration.
#
# Single version source: every dev tool (ruff, mypy, ty, pytest, …) is declared in
# [dependency-groups] and pinned by uv.lock. The pre-commit hooks and CI call them
# through `uv run --frozen`, so hook, terminal and CI run the identical version.
# Bump a tool with `uv lock --upgrade-package <tool>`, never by editing a hook rev.
#
# Runtime dependencies are added with the first feature that imports them; they must
# stay pure Python (docs/spec.md §7). mypy --strict is the type gate (spec AC-12);
# ty runs advisory only.

[project]
name = "milchglas"
version = "0.3.1"
description = "Busy-only ICS feed from private CalDAV calendars: presence visible, content opaque"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Philipp Sieder" }]
keywords = ["caldav", "icalendar", "ics", "free-busy", "privacy", "nextcloud"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "icalendar>=7",
    "tzdata>=2026.5",
]

[project.urls]
Homepage = "https://github.com/Prism-Purpose-Pace/milchglas"
Issues = "https://github.com/Prism-Purpose-Pace/milchglas/issues"
Security = "https://github.com/Prism-Purpose-Pace/milchglas/security/policy"
Changelog = "https://github.com/Prism-Purpose-Pace/milchglas/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
# scripts/ holds stdlib gate scripts that tests import as first-party modules.
src = ["src", "scripts"]

[tool.ruff.lint]
# Everything on: new ruff rules arrive with a deliberate `uv lock --upgrade-package
# ruff`, never silently. Rules that matter most here: DTZ (naive datetimes break the
# Europe/Berlin DST rounding), T20 + LOG/G (no private calendar content via print or
# eager log formatting), BLE (a blind except would hide the keep-last-good-feed path,
# spec D-7d), PGH (no blanket type-ignores), S (security).
select = ["ALL"]
# Each exemption is global and argued; path-specific ones go to per-file-ignores.
ignore = [
    "E501",   # line length is owned by the formatter
    "COM812", # conflicts with the formatter's trailing-comma handling
    "D",      # docstrings are not gated; types + tests carry the contract
    "CPY001", # no per-file copyright headers; the licence lives in LICENSE
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# src/milchglas/core is the pure pipeline (spec §8: filter → reduce → clip → round →
# merge → emit): no I/O, so it stays byte-deterministic and trivially testable. The
# ban applies to core only (negated per-file-ignore below) and is import-level:
# builtin open() is caught separately by PTH123 (its fix, pathlib, is banned here);
# a dynamic __import__("…") is invisible to ruff and stays a review-only residual.
"os".msg = "core/ is pure: no I/O or environment access"
"pathlib".msg = "core/ is pure: no filesystem access"
"shutil".msg = "core/ is pure: no filesystem access"
"tempfile".msg = "core/ is pure: no filesystem access"
"socket".msg = "core/ is pure: no network access"
"http".msg = "core/ is pure: no network access"
"urllib".msg = "core/ is pure: no network access"
"subprocess".msg = "core/ is pure: no process spawning"
"io".msg = "core/ is pure: no stream I/O — return strings/bytes, let the caller write"
"sys".msg = "core/ is pure: no stdin/stdout/argv access"
"importlib".msg = "core/ is pure: no dynamic imports"

[tool.ruff.lint.per-file-ignores]
"!src/milchglas/core/**" = ["TID251"]
# emit takes one argument per field of the published feed (blocks, summary, salt, ttl,
# version, now, dtstamps); a parameter object would only rename them.
"src/milchglas/core/emit.py" = ["PLR0913"]
# fetch opens the calendar URL built from CALDAV_URL; its scheme is the configuration's
# rule (https only, FR-1 and NFR-S7: ORCH-CFG-2), not something a request can check.
"src/milchglas/sources/caldav.py" = ["S310"]
# _components hands untrusted server text to icalendar, which fails with at least seven
# exception classes (a fuzz run found ValueError, TypeError, AttributeError,
# AssertionError, OSError among them); any of them marks the object unparsable and
# fails the refresh (Q-14), so the blind except keeps D-7d instead of hiding it.
"src/milchglas/sources/multistatus.py" = ["BLE001"]
# These tests hand naive datetimes to core on purpose: core must refuse them.
"tests/unit/core/test_emit.py" = ["DTZ001"]
"tests/unit/core/test_model.py" = ["DTZ001"]
# pytest idioms: assertion rewriting, literal expectations. INP001 stays ON: every
# test directory is a package, otherwise equal test basenames in tests/unit and
# tests/contract collide in both mypy and pytest.
"tests/**/*.py" = ["S101", "PLR2004"]
# The CalDAV world's server checks a made-up app password, never a real one.
"tests/unit/sources/test_caldav.py" = ["S105"]
# One test builds a throwaway git repository to prove the guard's range semantics.
"tests/scripts/test_check_public_tree.py" = ["S101", "PLR2004", "S603", "S607"]
# Plants a hook's git environment at a decoy repository and runs a test file under it.
"tests/meta/test_hook_environment.py" = ["S101", "PLR2004", "S603", "S607"]
# Stdlib gate scripts: print is their CLI output; subprocess runs literal git/gh argv.
"scripts/*.py" = ["T201", "C901", "FURB167", "PERF401", "INP001"]
"scripts/check_commit_msg.py" = ["PLR0912", "PLR2004"]
"scripts/check_commit_size.py" = ["S603", "S607", "PLR2004"]
"scripts/audit_script_deps.py" = ["S603", "S607", "PLW1510"]
"scripts/check_public_tree.py" = ["S603", "S607"]
"scripts/check_push_ancestry.py" = ["S603", "S607"]
"scripts/github_bootstrap.py" = ["S603"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy — strict type-check (spec AC-12)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
# Package code and tests. Tests import the gate scripts they cover, so mypy follows
# those scripts through mypy_path; the remaining scripts/ are not typed surface.
files = ["src", "tests"]
mypy_path = "scripts"
warn_unreachable = true
# Beyond --strict: codes that catch real bugs in interval/rounding logic (truthy tests
# on possibly-empty values, redundant or unreachable branches, unmatched cases) and
# keep suppressions narrow (ignore-without-code forbids a bare `# type: ignore`).
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "redundant-self",
    "explicit-override",
    "mutable-override",
    "exhaustive-match",
    "deprecated",
    "unused-awaitable",
]

# ---------------------------------------------------------------------------
# pytest + coverage — native [tool.pytest] table (pytest >= 9)
# ---------------------------------------------------------------------------
[tool.pytest]
testpaths = ["tests"]
pythonpath = ["scripts"]
# Contract tests need a live sabre/dav server (Baïkal); excluded by default, run them
# with `uv run pytest -m contract` (a later -m overrides this one).
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not contract",
    "--cov=milchglas",
    "--cov=scripts",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "contract: needs a live sabre/dav server (Baïkal container); run with -m contract",
]
# pytest-bdd: `scenario("caldav/fetch.feature", …)` resolves under this folder.
bdd_features_base_dir = "tests/features/"
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
# scripts/ is in scope: the release guards live there and the suite imports them
# in-process, so without them the floor would measure only the empty package and
# could never fail. The emitted upstream gates are tested upstream, not here.
source = ["milchglas", "scripts"]
omit = [
    "scripts/audit_script_deps.py",
    "scripts/check_commit_msg.py",
    "scripts/check_commit_size.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# mutmut — mutation testing, advisory (.github/workflows/mutation.yml)
# ---------------------------------------------------------------------------
[tool.mutmut]
source_paths = ["src/milchglas/"]
# The purity test reads core/'s imports, and mutmut's trampolines add their own there.
pytest_add_cli_args = ["--no-cov", "--ignore=tests/unit/test_core_purity.py"]
pytest_add_cli_args_test_selection = ["tests/unit"]
use_git_change_detection = false
# The one file the unit tests read beside the package.
also_copy = ["config.example.json"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-bdd>=9.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
mutation = [
    "mutmut>=3.8.0",
]
