version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    labels: [dependencies]
    assignees: [philippsied]
    # A runtime package ships in the image and cuts a patch release (`fix(deps)`); a dev
    # package does not (`build(deps-dev)`). TOOLING.md, Daily release.
    commit-message:
      prefix: fix
      prefix-development: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
    assignees: [philippsied]
    commit-message:
      prefix: ci
      include: scope

  # The Option B image (Dockerfile): a new digest of the pinned tags arrives as a pull
  # request; minor and major Python versions are held, the image stays on 3.12 (D-9).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels: [dependencies]
    assignees: [philippsied]
    # A new base image changes the shipped image: `fix(deps)`, a patch release.
    commit-message:
      prefix: fix
      include: scope
