name: Bug report
description: Milchglas behaves differently than documented
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Do not file it here — use [private vulnerability reporting](https://github.com/philippsied/milchglas/security/advisories/new).
        **Privacy:** never paste real calendar data, feed URLs with tokens, hostnames or credentials. Reproduce with synthetic events.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.0 or 1a2b3c4
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker containers (option B)
        - systemd on a VPS (option A)
        - Shared Python hosting (option C)
        - Other / local run
    validations:
      required: true
  - type: dropdown
    id: consumer
    attributes:
      label: Affected consumer
      options:
        - Not consumer-specific
        - OX App Suite (e.g. mailbox.org)
        - meetergo
        - Other ICS client
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Reference the spec section or acceptance criterion if you can (e.g. AC-6).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal synthetic ICS input and the relevant `config.json` keys (token removed).
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Redact tokens and hostnames.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no private calendar content, tokens, hostnames or credentials.
          required: true
