name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job ids lint, typecheck, test, public-guard, secret-scan, osv-scan, dependency-review
# and zizmor are required checks of the main ruleset (scripts/github_bootstrap.py);
# rename them only together.
jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.12" # uv itself must not drift under `uv lock --check`
      - run: uv lock --check
      - run: uv run --frozen ruff check --output-format=github
      - run: uv run --frozen ruff format --check

  typecheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.12" # uv itself must not drift under `uv lock --check`
      - run: uv run --frozen mypy

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GATE-22 compares feature ids with the merge base of origin/main (D-18).
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.12" # uv itself must not drift under `uv lock --check`
      - run: uv run --frozen pytest

  public-guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The secret exists as an Actions secret and as a Dependabot secret; only pull
      # requests from forks run without it (paths only) and are re-checked on main.
      # Commit messages are scanned for the range a change ADDS, never the whole history:
      # base..head on a pull request, before..sha on a push. Commits GitHub creates itself
      # (the merge preview, the squash commit of a merged PR) carry the account's bare
      # display name instead of the identity the branch commits carry; once one of them
      # landed (a995e8f), a whole-history scan kept main and every later PR red for good.
      # Published history was scanned when it landed and cannot be rewritten anyway.
      # workflow_dispatch has no base and scans its tip commit only.
      - name: Private paths, private terms and commit messages
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            SCAN_RANGE="$BASE_SHA..$HEAD_SHA"
          else
            SCAN_RANGE="$HEAD_SHA^!"
          fi
          if [ -n "$PUBLIC_DENYLIST" ]; then
            python3 scripts/check_public_tree.py --require-denylist --commit-messages "$SCAN_RANGE"
          elif [ "$FROM_FORK" = "true" ]; then
            echo "::warning::PUBLIC_DENYLIST is not available to fork pull requests: checking paths only"
            python3 scripts/check_public_tree.py
          else
            echo "::error::Actions secret PUBLIC_DENYLIST is not configured"
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          extra_args: --results=verified,unknown

  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # Fork pull requests cannot write code-scanning results; the job still fails on
      # a vulnerability.
      upload-sarif: ${{ github.event_name != 'pull_request' }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
