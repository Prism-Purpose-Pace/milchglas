name: Mutation

# Advisory, never a required check: mutmut mutates src/milchglas/, runs the unit tests
# against every mutant and lists the mutants no test noticed. A survivor is a question
# for review, not a failure: many change only a message text or nothing observable.
# Weekly and on demand, because a full run takes far longer than the CI jobs.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutmut:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.12" # uv itself must not drift under `uv lock --check`
      - run: uv run --frozen --group mutation mutmut run
      - name: Counts and survivors to the job summary
        if: ${{ !cancelled() }}
        run: |
          uv run --frozen --group mutation mutmut export-cicd-stats
          {
            echo '## Mutation testing'
            echo '```json'
            cat mutants/mutmut-cicd-stats.json
            echo
            echo '```'
            echo '### Survivors'
            echo '```'
            uv run --frozen --group mutation mutmut results
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
